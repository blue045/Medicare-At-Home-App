name: Build Flutter Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    # IMPORTANT: Change this to your real Cloudflare Pages website URL if different.
    # Example: https://your-project-name.pages.dev
    env:
      API_BASE_URL: https://medicareathome.pages.dev

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android Gradle project
        run: flutter create --platforms=android --project-name medicare_at_home_flutter --org com.medicareathome .

      - name: Remove generated default Flutter test
        run: rm -rf test

      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission,
                  1,
              )
          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicareAtHome-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
